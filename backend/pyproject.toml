[project]
name = "music-recommendation-backend"
version = "0.1.0"
description = "FastAPI backend for the music recommendation app foundation."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.117.1",
    "pydantic-settings==2.10.1",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
